# Task config for datasets from scripts/draw_simple/generate_simple_drawings.py -- the kinematic
# env/draw_simple env, where every demo of a task renders a bit-identical goal image while stroke
# order and per-stroke pacing vary.
#
# A copy of task/draw.yaml rather than a layer over it, so the published baselines on
# datasets/draw/procedural_2000_10.zarr (experiments/draw_sim/baselines_and_ablations.sh) keep
# reading exactly the config they were run with.
name: draw_simple

obs_horizon: 2
action_horizon: 16

eval_dataset_path: null # optional, dataset of tasks to use only for env runner evaluation
eval_rollout_only_task_names: null # for selecting a subset of eval dataset tasks to use for rollout
eval_rollout_max_tasks: null # select the first n tasks from the eval dataset to use for rollout
train_rollout_only_task_names: null # for selecting a subset of train dataset tasks to use for rollout
train_rollout_max_tasks: 10 # select the first n tasks from the train dataset to use for rollout

live_demo: false # not supported for draw_simple: scripts/draw/demo_draw.py::collect_demos is a pygame loop built around DrawEnv (render_mode='human', pymunk agent), and SimpleDrawEnv has no human render mode. Collecting a hand-drawn prompt here also needs the prompt captured as a strategy rather than as pixels, since this env only inks within snap_tol of the canonical polyline.

shape_meta: &shape_meta
  image_resolution: 224
  prompt_sequence_length: 800 # 800 steps at 10Hz is 80 seconds; this needs to be at least twice as long as the longest demonstration in the dataset (since we need to fit entire prompt + entire rollout)
  sequence_prompting_min_steps_per_task: 1000
  max_prompt_full_demos: 1
  prompt_chunk_n_actions: 10 # 10 steps at 10Hz is 1 second
  pad_end_prompt_actions: 'no' # no (default), zeros, or repeat
  max_sequence_length: 512 # longest demonstration in the drawing dataset
  use_prompting: false
  prompt_sample_mode: pair
  action:
    horizon: ${task.action_horizon}
    down_sample_steps: 1
    type: low_dim
    shape: [3]  # x, y, pen_down
    components:
      - type: pos
        size: 2
      - type: pen_down
        size: 1
  obs:
    image:
      horizon: ${task.obs_horizon}
      down_sample_steps: 1
      shape: [3, 224, 224]
      type: rgb
      prompt_type: observation
      include_in_prompt_current_obs: true
    agent_pos:
      shape: [2]
      type: low_dim
      horizon: ${task.obs_horizon}
      down_sample_steps: 1
      prompt_type: proprioception
      include_in_prompt_current_obs: true
    pen_down:
      shape: [1]
      type: low_dim
      horizon: ${task.obs_horizon}
      down_sample_steps: 1
      prompt_type: proprioception
      include_in_prompt_current_obs: true
    goal_image:
      # Condition on the ink-only rendering, not the last observation frame.
      #
      # With `key: image` (the draw.yaml default) the goal is the final *observation*, which
      # includes the green agent marker wherever the cursor stopped. On this data that leaks the
      # strategy: measured on draw_simple_0001, the 8 demos' goal images differ in ~294 px and the
      # marker centroid takes exactly 3 distinct positions -- one per possible final stroke.
      # `drawing_image` is ink on white, bit-identical across all demos of a task, which is the
      # whole property this dataset was built to have.
      #
      # It is 512x512 on disk; DrawImageDataset downsamples it to the shape below.
      key: drawing_image
      share_rgb_model: image
      horizon: 1
      shape: [3, 224, 224]
      type: rgb
      in_replay_buffer: false
      ignore_by_policy: false
      prompt_type: ignore
      include_in_prompt_current_obs: false

env_runner:
  _target_: behavior_prompting.train_network.env_runner.draw_simple_runner.SimpleDrawRunner
  crf: 22
  fps: 10
  # Longest episode in simple_order_pacing_eval.zarr is 101 steps (mean 57), so this is ~2x the
  # worst case. The old env's 400 was sized for the PD controller's settle holds, which this
  # kinematic env does not have.
  max_steps: 200
  n_test: 22
  n_test_vis: 1
  n_train: 10
  n_train_vis: 1
  test_start_seed: 10000
  tqdm_interval_sec: 1.0
  shape_meta: ${shape_meta}
  # SimpleDrawRunner overrides the angle per env from the goal image's own recorded boundary_angle,
  # so the goal ink and the canvas always share an orientation. These two exist to satisfy
  # DrawRunner.__init__ and are not what sets the angle.
  boundary_angle: null
  set_boundary_angle_from_task_name: false
  exec_action_horizon: 12
  vis_prompt: false
  vis_attention_map: true
  attention_map_version: v2
  vis_goal_image: false
  vis_env_index: 0
  overlay_action_cross: true
  overlay_reward: true
  overlay_target_drawing: true # maps onto SimpleDrawEnv.overlay_goal
  render_cache_size: null
  save_attention_weights: false
  save_canvas_step: null # unsupported by SimpleDrawEnv; SimpleDrawRunner asserts these stay null
  restore_canvas_step: null
  # Sidecars written next to the per-task zarrs by generate_simple_drawings.py. Required: the
  # StrokeGeometry SimpleDrawEnv needs to rasterise its goal is not stored in the merged zarr.
  # Relative to train_network/, which is where train.py runs from (hydra.job.chdir is off, so the
  # cwd is not the run dir) -- hence ../../ to reach the repo root, unlike dataset_path, whose
  # datasets/ lives under train_network/.
  geometry_dir: ../../drawanything_sim_datasets/simple_order_pacing_2000
  # Strategy metrics are computed over completed drawings only -- an unfinished rollout has a
  # truncated, meaningless stroke order. See utils/draw_strategy_metrics.py.
  strategy_coverage_threshold: 0.9

eval_image_transforms:
  _target_: behavior_prompting.train_network.common.augmentation.ImageAugmentation
  shape_meta: ${shape_meta}
  transforms:
    - type: CenterCrop
      ratio: 0.95
    - _target_: torchvision.transforms.Resize
      size: [224, 224]

train_image_transforms:
  _target_: behavior_prompting.train_network.common.augmentation.ImageAugmentation
  shape_meta: ${shape_meta}
  transforms:
    - type: RandomCrop
      ratio: 0.95
    - _target_: torchvision.transforms.Resize
      size: [224, 224]
    - _target_: torchvision.transforms.ColorJitter
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08

dataset:
  _target_: behavior_prompting.train_network.dataset.draw_image_dataset.DrawImageDataset
  dataset_path: null
  shape_meta: ${shape_meta}
  seed: 42
  val_ratio: 0.1
  sample_type: task
  max_segments: -1
  action_padding: true
  only_task_names: null # for selecting a subset of tasks to use for training
  max_tasks: null # select the first n tasks from the dataset to use for training
  num_training_demos_per_task: null
  receding_obs_augmentation_enabled: false
  receding_obs_augmentation_probability: 0.2
  receding_obs_augmentation_min_shapes: 1
  receding_obs_augmentation_max_shapes: 3
  receding_obs_augmentation_debug: false
  # The generator fixes the board angle per task, so all demos of a task share one goal image and a
  # goal encoder would otherwise see only num_tasks distinct inputs, each repeated demos_per_task
  # times. The older per-demo board angle supplied this rotation diversity for free; this puts it
  # back at training time. Disabled automatically for validation and for the runner's goal-image
  # dataset.
  goal_rotation_augmentation_enabled: true
  # <1 keeps some crisply-rendered goal images in the mix; a rotated one is bilinearly resampled
  # and so slightly softer than what the env renders at rollout.
  goal_rotation_augmentation_probability: 0.8
  # Target board-angle range; matches the env's own sampling range so augmented angles stay
  # on-distribution instead of merely near it.
  goal_rotation_augmentation_low: -0.7853981633974483   # -pi/4
  goal_rotation_augmentation_high: 0.7853981633974483   #  pi/4
